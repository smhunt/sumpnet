# sumpnet local stack (prompt_plan.md §3). Published ports come from .env
# (see .env.example). Run via `make up` from the repo root.
#
# NOTE: the single postgres instance hosts both the sumpnet and chirpstack
# databases, so `docker compose down -v` wipes both.
name: sumpnet

# Environment maps DO merge with <<:, so services extend *go-env with their own vars.
x-go-env: &go-env
  LOG_LEVEL: ${LOG_LEVEL:-info}
  HTTP_ADDR: ":8080"

x-go-service: &go-service
  restart: unless-stopped
  environment: *go-env
  healthcheck:
    # distroless has no curl; the binary probes its own /readyz.
    test: ["CMD", "/svc", "healthcheck"]
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 5s

services:
  postgres:
    image: ghcr.io/dbsystel/postgresql-partman:16-5
    environment:
      POSTGRES_USER: sumpnet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: sumpnet
      CHIRPSTACK_DB_PASSWORD: ${CHIRPSTACK_DB_PASSWORD}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_partman_bgw
      - -c
      - pg_partman_bgw.dbname=sumpnet
      - -c
      - pg_partman_bgw.role=sumpnet
      - -c
      - timezone=UTC # partman month boundaries are computed in the session timezone
    volumes:
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sumpnet -d sumpnet"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot schema migration (golang-migrate). ingest waits for it and also
  # verifies the schema version itself at startup.
  migrate:
    image: migrate/migrate:v4.19.1
    command:
      - -path=/migrations
      - -database=postgres://sumpnet:${POSTGRES_PASSWORD}@postgres:5432/sumpnet?sslmode=disable
      - up
    volumes:
      - ../../migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  redis:
    image: redis:7-alpine
    command: redis-server --save 300 1 --save 60 100 --appendonly no
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosqdata:/mosquitto/data
    ports:
      - "${MQTT_PORT}:1883"
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-h", "127.0.0.1", "-t", "$$SYS/broker/uptime", "-C", "1", "-W", "3"]
      interval: 5s
      timeout: 5s
      retries: 10

  chirpstack:
    image: chirpstack/chirpstack:4.19
    command: -c /etc/chirpstack
    volumes:
      - ./chirpstack:/etc/chirpstack:ro
    environment:
      POSTGRESQL_HOST: postgres
      CHIRPSTACK_DB_PASSWORD: ${CHIRPSTACK_DB_PASSWORD}
      REDIS_HOST: redis
      MQTT_BROKER_HOST: mosquitto
      CHIRPSTACK_API_SECRET: ${CHIRPSTACK_API_SECRET}
    ports:
      - "${CHIRPSTACK_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    healthcheck:
      # Image is alpine + ca-certificates: busybox wget only, no curl.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  # Only needed once real LoRaWAN gateways exist (Phase 7):
  #   COMPOSE_PROFILES=gateways make up
  chirpstack-gateway-bridge:
    profiles: ["gateways"]
    image: chirpstack/chirpstack-gateway-bridge:4
    ports:
      - "${GW_UDP_PORT}:1700/udp"
    volumes:
      - ./chirpstack-gateway-bridge:/etc/chirpstack-gateway-bridge:ro
    environment:
      # Must match topic_prefix in chirpstack/region_us915_0.toml.
      INTEGRATION__MQTT__EVENT_TOPIC_TEMPLATE: "us915_0/gateway/{{ .GatewayID }}/event/{{ .EventType }}"
      INTEGRATION__MQTT__STATE_TOPIC_TEMPLATE: "us915_0/gateway/{{ .GatewayID }}/state/{{ .StateType }}"
      INTEGRATION__MQTT__COMMAND_TOPIC_TEMPLATE: "us915_0/gateway/{{ .GatewayID }}/command/#"
    depends_on:
      mosquitto:
        condition: service_healthy

  # --- Go services (placeholders until their phase) -------------------------
  # YAML anchors cannot deep-merge build.args, so each service restates build:.

  # The simulator is a CLI, not a service: opt in with COMPOSE_PROFILES=sim
  # (or use `make sim`, which runs it from the host). One replay, then exit.
  simulator:
    profiles: ["sim"]
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE: simulator
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-unknown}
    restart: "no"
    command:
      - -scenario=${SIM_SCENARIO:-storm50}
      - -seed=${SIM_SEED:-42}
      - -speed=${SIM_SPEED:-60}
      - -homes=${SIM_HOMES:-60}
      - -sink=mqtt
      - -mqtt-url=mqtt://mosquitto:1883
      - -hash
    depends_on:
      mosquitto:
        condition: service_healthy

  lora-bridge:
    <<: *go-service
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE: lora-bridge
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-unknown}
    environment:
      <<: *go-env
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_CLIENT_ID: lora-bridge
      INGEST_ADDR: ingest:9090
    depends_on:
      mosquitto:
        condition: service_healthy
      ingest:
        condition: service_healthy

  mqtt-bridge:
    <<: *go-service
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE: mqtt-bridge
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-unknown}
    environment:
      <<: *go-env
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_CLIENT_ID: mqtt-bridge
      MQTT_TOPIC: sumpnet/v1/+/up
      INGEST_ADDR: ingest:9090
    depends_on:
      mosquitto:
        condition: service_healthy
      ingest:
        condition: service_healthy

  ingest:
    <<: *go-service
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE: ingest
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-unknown}
    environment:
      <<: *go-env
      DATABASE_URL: postgres://sumpnet:${POSTGRES_PASSWORD}@postgres:5432/sumpnet?sslmode=disable
      GRPC_ADDR: ":9090"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  cycle-detector:
    <<: *go-service
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE: cycle-detector
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-unknown}
    environment:
      <<: *go-env
      DATABASE_URL: postgres://sumpnet:${POSTGRES_PASSWORD}@postgres:5432/sumpnet?sslmode=disable
      POLL_INTERVAL: 30s
      WATERMARK_LAG: 5s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  storm-analytics:
    <<: *go-service
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE: storm-analytics
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-unknown}
    depends_on:
      postgres:
        condition: service_healthy

  weather:
    <<: *go-service
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE: weather
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-unknown}
    depends_on:
      postgres:
        condition: service_healthy

  alerts:
    <<: *go-service
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE: alerts
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-unknown}
    environment:
      <<: *go-env
      DATABASE_URL: postgres://sumpnet:${POSTGRES_PASSWORD}@postgres:5432/sumpnet?sslmode=disable
      GRPC_ADDR: ":9091"
      POLL_INTERVAL: 30s
      WATERMARK_LAG: 5s
      # Real provider SMTP from .env; an empty SMTP_HOST logs instead of sending.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS: ${SMTP_TLS:-auto}
      ALERTS_TO: ${ALERTS_TO:-}
      ALERTS_EMAIL_MIN_SEVERITY: warning
      ALERTS_NOTIFY_COOLDOWN: 1h
      ALERTS_NOTIFY_RESOLVE: critical
      ALERTS_OFFLINE_AFTER: 1h
    ports:
      - "${ALERTS_GRPC_PORT}:9091"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # QueryService: gRPC on :9092 (compose-internal; the Phase 6 MCP server
  # dials it) and REST on :8080, published as https://dev.ecoworks.ca:${API_PORT}
  # with the shared mkcert certificate. The ops/healthcheck listener moves to
  # :8081 so it stays plain HTTP inside the container.
  api-gateway:
    <<: *go-service
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE: api-gateway
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-unknown}
    environment:
      <<: *go-env
      HTTP_ADDR: ":8081"
      REST_ADDR: ":8080"
      GRPC_ADDR: ":9092"
      DATABASE_URL: postgres://sumpnet:${POSTGRES_PASSWORD}@postgres:5432/sumpnet?sslmode=disable
      ALERTS_ADDR: alerts:9091
      TLS_CERT_FILE: /certs/cert.pem
      TLS_KEY_FILE: /certs/key.pem
      # A machine without the mkcert certs (CI, a fresh lab VM) serves plain HTTP.
      TLS_FALLBACK_HTTP: "true"
      CORS_ALLOWED_ORIGINS: ${WEB_ORIGIN:-https://dev.ecoworks.ca:3034}
      # Clerk owner sign-in; empty CLERK_ISSUER = public views only.
      CLERK_ISSUER: ${CLERK_ISSUER:-}
      CLERK_JWKS_URL: ${CLERK_JWKS_URL:-}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:-}
      STATUS_WINDOW: ${STATUS_WINDOW:-1h}
      WATCH_POLL_INTERVAL: 10s
    volumes:
      - ${TLS_CERT_DIR:-~/Code/.traefik/certs}:/certs:ro
    ports:
      - "${API_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      alerts:
        condition: service_healthy

  mcp-server:
    <<: *go-service
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE: mcp-server
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-unknown}
    depends_on:
      api-gateway:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  mosqdata:
