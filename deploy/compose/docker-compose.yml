# sumpnet local stack (prompt_plan.md §3). Published ports come from .env
# (see .env.example). Run via `make up` from the repo root.
#
# NOTE: the single postgres instance hosts both the sumpnet and chirpstack
# databases, so `docker compose down -v` wipes both.
name: sumpnet

x-go-service: &go-service
  restart: unless-stopped
  environment:
    LOG_LEVEL: ${LOG_LEVEL:-info}
    HTTP_ADDR: ":8080"
  healthcheck:
    # distroless has no curl; the binary probes its own /readyz.
    test: ["CMD", "/svc", "healthcheck"]
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 5s

services:
  postgres:
    image: ghcr.io/dbsystel/postgresql-partman:16-5
    environment:
      POSTGRES_USER: sumpnet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: sumpnet
      CHIRPSTACK_DB_PASSWORD: ${CHIRPSTACK_DB_PASSWORD}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_partman_bgw
      - -c
      - pg_partman_bgw.dbname=sumpnet
      - -c
      - pg_partman_bgw.role=sumpnet
    volumes:
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sumpnet -d sumpnet"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --save 300 1 --save 60 100 --appendonly no
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosqdata:/mosquitto/data
    ports:
      - "${MQTT_PORT}:1883"
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-h", "127.0.0.1", "-t", "$$SYS/broker/uptime", "-C", "1", "-W", "3"]
      interval: 5s
      timeout: 5s
      retries: 10

  chirpstack:
    image: chirpstack/chirpstack:4.19
    command: -c /etc/chirpstack
    volumes:
      - ./chirpstack:/etc/chirpstack:ro
    environment:
      POSTGRESQL_HOST: postgres
      CHIRPSTACK_DB_PASSWORD: ${CHIRPSTACK_DB_PASSWORD}
      REDIS_HOST: redis
      MQTT_BROKER_HOST: mosquitto
      CHIRPSTACK_API_SECRET: ${CHIRPSTACK_API_SECRET}
    ports:
      - "${CHIRPSTACK_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    healthcheck:
      # Image is alpine + ca-certificates: busybox wget only, no curl.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  # Only needed once real LoRaWAN gateways exist (Phase 7):
  #   COMPOSE_PROFILES=gateways make up
  chirpstack-gateway-bridge:
    profiles: ["gateways"]
    image: chirpstack/chirpstack-gateway-bridge:4
    ports:
      - "${GW_UDP_PORT}:1700/udp"
    volumes:
      - ./chirpstack-gateway-bridge:/etc/chirpstack-gateway-bridge:ro
    environment:
      # Must match topic_prefix in chirpstack/region_us915_0.toml.
      INTEGRATION__MQTT__EVENT_TOPIC_TEMPLATE: "us915_0/gateway/{{ .GatewayID }}/event/{{ .EventType }}"
      INTEGRATION__MQTT__STATE_TOPIC_TEMPLATE: "us915_0/gateway/{{ .GatewayID }}/state/{{ .StateType }}"
      INTEGRATION__MQTT__COMMAND_TOPIC_TEMPLATE: "us915_0/gateway/{{ .GatewayID }}/command/#"
    depends_on:
      mosquitto:
        condition: service_healthy

  # --- Go services (placeholders until their phase) -------------------------
  # YAML anchors cannot deep-merge build.args, so each service restates build:.

  simulator:
    <<: *go-service
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE: simulator
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-unknown}
    depends_on:
      mosquitto:
        condition: service_healthy

  lora-bridge:
    <<: *go-service
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE: lora-bridge
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-unknown}
    depends_on:
      mosquitto:
        condition: service_healthy

  mqtt-bridge:
    <<: *go-service
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE: mqtt-bridge
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-unknown}
    depends_on:
      mosquitto:
        condition: service_healthy

  ingest:
    <<: *go-service
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE: ingest
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-unknown}
    depends_on:
      postgres:
        condition: service_healthy

  cycle-detector:
    <<: *go-service
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE: cycle-detector
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-unknown}
    depends_on:
      postgres:
        condition: service_healthy

  storm-analytics:
    <<: *go-service
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE: storm-analytics
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-unknown}
    depends_on:
      postgres:
        condition: service_healthy

  weather:
    <<: *go-service
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE: weather
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-unknown}
    depends_on:
      postgres:
        condition: service_healthy

  alerts:
    <<: *go-service
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE: alerts
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-unknown}
    depends_on:
      postgres:
        condition: service_healthy

  api-gateway:
    <<: *go-service
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE: api-gateway
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-unknown}
    ports:
      - "${API_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  mcp-server:
    <<: *go-service
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE: mcp-server
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-unknown}
    depends_on:
      api-gateway:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  mosqdata:
