# sumpnet local broker. Anonymous access is for the lab stack only.
listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
log_dest stdout

# QoS 1 bursts from a storm replay: the defaults (20 in flight, 1000 queued)
# would throttle the bridge and then silently drop messages.
max_inflight_messages 1000
max_queued_messages 100000
