name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write # buf-action posts a summary comment on PRs

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Single source of truth for tool versions is .versions.env (shared with the Makefile).
  versions:
    runs-on: ubuntu-latest
    outputs:
      buf: ${{ steps.v.outputs.buf }}
      golangci: ${{ steps.v.outputs.golangci }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          set -a; . ./.versions.env; set +a
          echo "buf=${BUF_VERSION#v}" >> "$GITHUB_OUTPUT"
          echo "golangci=${GOLANGCI_LINT_VERSION}" >> "$GITHUB_OUTPUT"

  buf:
    needs: versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bufbuild/buf-action@v1
        with:
          version: ${{ needs.versions.outputs.buf }}
          lint: true
          format: true
          # Breaking-change check needs a base ref; only meaningful on PRs.
          breaking: ${{ github.event_name == 'pull_request' }}
          push: false
          archive: false
      - name: Generated code is up to date
        run: |
          buf generate
          git diff --exit-code -- gen/ || { echo '::error::gen/ is stale — run make proto and commit'; exit 1; }

  lint:
    needs: versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ needs.versions.outputs.golangci }}
      - name: Formatters
        run: golangci-lint fmt --diff ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go mod verify
      - run: go build ./...
      - run: go test -race -count=1 -coverprofile=coverage.out ./...

  test-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 -tags integration ./...

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose -f deploy/compose/docker-compose.yml --env-file deploy/compose/.env.example config -q

  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - simulator
          - lora-bridge
          - mqtt-bridge
          - ingest
          - cycle-detector
          - storm-analytics
          - weather
          - alerts
          - api-gateway
          - mcp-server
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false # private repo; image publishing arrives with Phase 8
          platforms: linux/amd64
          build-args: |
            SERVICE=${{ matrix.service }}
            VERSION=${{ github.sha }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
